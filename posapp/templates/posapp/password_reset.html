{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset</title>
    <link rel="stylesheet" href="{% static 'posapp/css/style.css' %}">
</head>
<body class="dashboard-page">
    <div class="dashboard-shell compact-shell">
        <main class="main-panel">
            <section class="panel-card">
                <div class="panel-header">
                    <h3>Password Reset</h3>
                    <a href="{% url 'accounts' %}" class="small-link">Back to Accounts</a>
                </div>
                <p>Set a new password for {{ user_obj.get_full_name|default:user_obj.username }}.</p>
                <form method="post" class="form-grid">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="field-wrap">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}<div class="error-text">{{ field.errors|join:', ' }}</div>{% endif %}
                        </div>
                    {% endfor %}
                    <div class="button-row">
                        <button type="submit" class="primary-btn">Reset Password</button>
                        <a href="{% url 'accounts' %}" class="secondary-btn">Cancel</a>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
